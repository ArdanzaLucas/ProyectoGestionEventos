<rect x="1330" y="140" width="470" height="121" fill="#fffde7" stroke="#bbb"/>
<text x="1338" y="158">PK = clave primaria, FK = clave foranea.</text>
<text x="1338" y="173">Las tablas se crean al arrancar si no existen (SqliteDatabase).</text>
<text x="1338" y="188">Los precios se guardan como TEXT y se leen como decimal.</text>
<text x="1338" y="203">QUOTE, DETAIL_MENU y DETAIL_OPTION_ITEM guardan una copia</text>
<text x="1338" y="218">de los nombres y precios: el presupuesto no cambia si despues</text>
<text x="1338" y="233">se edita el evento, la ubicacion, el menu o el servicio.</text>
<text x="1338" y="248">MENU_MENU_TAG es la tabla intermedia de menus y etiquetas.</text>
</svg>